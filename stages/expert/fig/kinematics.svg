<text x="700.0" y="44.0" font-family="DejaVu Sans" font-size="28" fill="#111" text-anchor="middle" font-weight="bold">Кинематика эксцентрикового кулачка с роликом</text>
<text x="700.0" y="74.0" font-family="DejaVu Sans" font-size="17" fill="#444" text-anchor="middle" font-weight="normal">x(θ) = e·sinθ + √((R+r)² − e²cos²θ) − (R+r); вторая гармоника e²/(2(R+r))</text>
