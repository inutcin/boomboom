<text x="120.0" y="802.0" font-family="DejaVu Sans" font-size="17" fill="#c0392b" text-anchor="start" font-weight="normal">Красная область — идеальный порог a_max=g. Точки — пороги; крестики — фактический 2-лепестковый профиль (C8).</text>
<text x="120.0" y="830.0" font-family="DejaVu Sans" font-size="16" fill="#444" text-anchor="start" font-weight="normal">При 5…7 Гц шарик не отрывается ни на одном диске. Порог 3 мм — 12,9 (факт 13,7), 5 мм — 10,0 (10,9), 10 мм — 7,05 (8,35) Гц.</text>
<text x="120.0" y="858.0" font-family="DejaVu Sans" font-size="16" fill="#444" text-anchor="start" font-weight="normal">Если «амплитуда» — нуль-пик, пороги 9,10/7,05/4,98 Гц, а диски 3/5/10 дают 1,5/2,5/5 мм и не покрывают 3…10 мм.</text>
