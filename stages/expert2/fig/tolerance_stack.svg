<text x="80.0" y="500.0" font-family="DejaVu Sans" font-size="16" fill="#c0392b" text-anchor="start" font-weight="normal">Осевая свобода кулачка без зажима: 22 − 8 = 14 мм; положительного буртика/втулки нет. C3: зажим только трением через PLA-буртик 64…74.</text>
