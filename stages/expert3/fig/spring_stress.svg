<text x="40.0" y="780.0" font-family="DejaVu Sans" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal">Вывод: L0=70 повышает контакт, но τ≈729 МПа и f_соб 8,64 Гц не позволяют принять 4×Ø12×1,0 без проверки/переделки.</text>
