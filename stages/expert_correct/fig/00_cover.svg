<rect x="0" y="0" width="420" height="297" fill="#ffffff"/>
<rect x="5" y="5" width="410" height="287" fill="#ffffff" stroke="#171717" stroke-width="0.8"/><rect x="10" y="10" width="400" height="277" fill="none" stroke="#171717" stroke-width="0.4"/><text x="30" y="40" font-size="10" text-anchor="start" font-weight="bold" fill="#171717" dominant-baseline="middle">ВИБРОСТОЛ</text><text x="30" y="56" font-size="5.2" text-anchor="start" font-weight="normal" fill="#666666" dominant-baseline="middle">Корректировки и замечания после инженерной экспертизы</text><line x1="30" y1="66" x2="390" y2="66" stroke="#171717" stroke-width="0.7"/><text x="30" y="82" font-size="4" text-anchor="start" font-weight="bold" fill="#171717" dominant-baseline="middle">Альбом листов этапа expert_correct</text><text x="32" y="100" font-size="4" text-anchor="start" font-weight="bold" fill="#1d4f8f" dominant-baseline="middle">01</text><text x="46" y="100" font-size="3.4" text-anchor="start" font-weight="bold" fill="#171717" dominant-baseline="middle">Общий вид установки</text><text x="46" y="105.2" font-size="2.6" text-anchor="start" font-weight="normal" fill="#666666" dominant-baseline="middle">рама, кожух, купол, привод</text><text x="32" y="115" font-size="4" text-anchor="start" font-weight="bold" fill="#1d4f8f" dominant-baseline="middle">02</text><text x="46" y="115" font-size="3.4" text-anchor="start" font-weight="bold" fill="#171717" dominant-baseline="middle">Подвеска стола</text><text x="46" y="120.2" font-size="2.6" text-anchor="start" font-weight="normal" fill="#666666" dominant-baseline="middle">балки, пружины, направляющие, демпферы</text><text x="32" y="130" font-size="4" text-anchor="start" font-weight="bold" fill="#1d4f8f" dominant-baseline="middle">03</text><text x="46" y="130" font-size="3.4" text-anchor="start" font-weight="bold" fill="#171717" dominant-baseline="middle">Контакт кулачка и роликов</text><text x="46" y="135.2" font-size="2.6" text-anchor="start" font-weight="normal" fill="#666666" dominant-baseline="middle">профили, кронштейны, 2×6202 на ролик</text><text x="32" y="145" font-size="4" text-anchor="start" font-weight="bold" fill="#1d4f8f" dominant-baseline="middle">04</text><text x="46" y="145" font-size="3.4" text-anchor="start" font-weight="bold" fill="#171717" dominant-baseline="middle">Крепление кулачка на оси</text><text x="46" y="150.2" font-size="2.6" text-anchor="start" font-weight="normal" fill="#666666" dominant-baseline="middle">смещение 50 мм, два подшипника, гайки</text><text x="32" y="160" font-size="4" text-anchor="start" font-weight="bold" fill="#1d4f8f" dominant-baseline="middle">05</text><text x="46" y="160" font-size="3.4" text-anchor="start" font-weight="bold" fill="#171717" dominant-baseline="middle">Крепление дрели</text><text x="46" y="165.2" font-size="2.6" text-anchor="start" font-weight="normal" fill="#666666" dominant-baseline="middle">U-болты M8, резина, упор от проворота</text><line x1="30" y1="182" x2="260" y2="182" stroke="#171717" stroke-width="0.4"/><text x="30" y="194" font-size="3" text-anchor="start" font-weight="normal" fill="#171717" dominant-baseline="middle">Габарит: 600 × 500 × 1060 мм</text><text x="30" y="203" font-size="2.8" text-anchor="start" font-weight="normal" fill="#171717" dominant-baseline="middle">Рама: 600 × 500 × 860, труба 30×30×1,5, раскосы</text><text x="30" y="212" font-size="2.8" text-anchor="start" font-weight="normal" fill="#171717" dominant-baseline="middle">Кожух: поликарбонат 4–5 мм, дверцы, купол Ø420</text><text x="30" y="221" font-size="2.8" text-anchor="start" font-weight="normal" fill="#171717" dominant-baseline="middle">Привод: дрель → патрон → шпилька M12 → 2 подшипника → кулачок</text><rect x="30" y="232" width="230" height="18" fill="#f7e6e6" stroke="#a11d1d" stroke-width="0.5"/><text x="34" y="241" font-size="2.8" text-anchor="start" font-weight="bold" fill="#a11d1d" dominant-baseline="middle">Масса ≈38–45 кг. Лимит 20 кг не выполнен — принятое отклонение.</text><text x="30" y="262" font-size="2.4" text-anchor="start" font-weight="normal" fill="#666666" dominant-baseline="middle">28.10.2026 · DeepSeek / OpenCode · A3 · 6 страниц</text><rect x="302.5" y="132.5" width="3.75" height="105" fill="#f4f4f4" stroke="#171717" stroke-width="0.3"/><rect x="373.75" y="132.5" width="3.75" height="105" fill="#f4f4f4" stroke="#171717" stroke-width="0.3"/><rect x="302.5" y="132.5" width="75" height="3.75" fill="#f4f4f4" stroke="#171717" stroke-width="0.3"/><rect x="302.5" y="233.75" width="75" height="3.75" fill="#f4f4f4" stroke="#171717" stroke-width="0.3"/><rect x="302.5" y="152.5" width="75" height="3.75" fill="#f4f4f4" stroke="#171717" stroke-width="0.3"/><line x1="306.25" y1="232.5" x2="373.75" y2="200" stroke="#9a9a9a" stroke-width="0.55"/><line x1="373.75" y1="232.5" x2="306.25" y2="200" stroke="#bdbdbd" stroke-width="0.35" stroke-dasharray="2 1.2"/><line x1="302.5" y1="183.75" x2="302.5" y2="132.5" stroke="#dceaf5" stroke-width="1.4"/><line x1="302.5" y1="233.75" x2="302.5" y2="183.75" stroke="#dceaf5" stroke-width="1.4"/><path d="M 313.75 168.75 L 313.75 115 Q 340 100 366.25 115 L 366.25 168.75" fill="#dceaf5" stroke="#1d4f8f" stroke-width="0.35" fill-opacity="0.15" stroke-linecap="round" stroke-linejoin="round"/><line x1="340" y1="168.75" x2="340" y2="107.5" stroke="#1d4f8f" stroke-width="0.2" stroke-dasharray="2 1"/><rect x="302.5" y="131.5" width="10.63" height="1" fill="#d8d8d8" stroke="#171717" stroke-width="0.25"/><rect x="366.88" y="131.5" width="10.63" height="1" fill="#d8d8d8" stroke="#171717" stroke-width="0.25"/><rect x="308.75" y="170" width="62.5" height="1.88" fill="#ededed" stroke="#171717" stroke-width="0.35"/><rect x="308.75" y="183.75" width="62.5" height="2.25" fill="#d8d8d8" stroke="#171717" stroke-width="0.3"/><circle cx="340" cy="168.75" r="2.06" fill="#d8d8d8" stroke="#171717" stroke-width="0.3"/><rect x="306.25" y="151.25" width="67.5" height="5" fill="#c4c4c4" stroke="#171717" stroke-width="0.3"/><polyline points="321.25,170 319.75,169.43 322.75,168.28 319