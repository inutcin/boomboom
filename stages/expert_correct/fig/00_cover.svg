<title>Обложка альбома expert_correct</title>
<defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="2.2" height="2.2" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="2.2" stroke="#555555" stroke-width="0.26"/>
