</text><line x1="355" y1="113.75" x2="358.75" y2="110.63" stroke="#171717" stroke-width="0.18"/><rect x="358.25" y="109.18" width="7.16" height="2.9" fill="#ffffff" stroke="none" stroke-width="0.45"/><text x="358.75" y="110.63" font-size="2" text-anchor="start" font-weight="normal" fill="#171717" dominant-baseline="middle">купол</text><line x1="372.5" y1="190.63" x2="377.5" y2="197.5" stroke="#171717" stroke-width="0.18"/><rect x="377" y="196.05" width="7.16" height="2.9" fill="#ffffff" stroke="none" stroke-width="0.45"/><text x="377.5" y="197.5" font-size="2" text-anchor="start" font-weight="normal" fill="#171717" dominant-baseline="middle">дрель</text><line x1="333.75" y1="187.5" x2="328.75" y2="195" stroke="#171717" stroke-width="0.18"/><rect x="318.63" y="193.55" width="9.62" height="2.9" fill="#ffffff" stroke="none" stroke-width="0.45"/><text x="328.75" y="195" font-size="2" text-anchor="end" font-weight="normal" fill="#171717" dominant-baseline="middle">кулачок</text><text x="340" y="260" font-size="1.8" text-anchor="middle" font-weight="normal" fill="#666666" dominant-baseline="middle">Схематично, без масштаба</text>
