<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1188" viewBox="0 0 420 297"><rect width="420" height="297" fill="#fff"/><rect x="4" y="4" width="412" height="289" fill="none" stroke="#000" stroke-width="0.5"/><rect x="6" y="6" width="408" height="285" fill="none" stroke="#000" stroke-width="0.25"/><text x="10" y="13" font-family="DejaVu Sans, Arial, sans-serif" font-size="6.0" font-weight="bold" text-anchor="start" fill="#000">ИНСТРУКЦИЯ ПО СБОРКЕ fix11 — 6 ШАГОВ</text><line x1="8" y1="16.5" x2="412" y2="16.5" stroke="#000" stroke-width="0.35"/><rect x="10" y="20" width="128" height="112" fill="none" stroke="#000" stroke-width="0.25"/><text x="12" y="28" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.0" font-weight="bold" text-anchor="start" fill="#000">1. СТОЛ</text><text x="12" y="35" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">LMK: 4×M4×12 снизу в цековку фланца; гайки M4 nyloc</text><text x="12" y="39.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">в углубления 7,2×5 стола на клей, заподлицо.</text><text x="12" y="43.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">Накладка: 4 потайных M4. Кронштейны ролика: M4×16</text><text x="12" y="47.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">в Ø8×5 и паз 10×5, гайки снизу.</text><rect x="146" y="20" width="128" height="112" fill="none" stroke="#000" stroke-width="0.25"/><text x="148" y="28" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.0" font-weight="bold" text-anchor="start" fill="#000">2. СТОЛ НА ВАЛЫ</text><text x="148" y="35" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">Валы снизу: средняя поперечина → резиновое кольцо</text><text x="148" y="39.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">(демпфер) → стол с LMK → шайба → пружина → шайба</text><text x="148" y="43.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">→ верхняя поперечина. Ограничители: нижний под</text><text x="148" y="47.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">поперечиной, верхний над верхней. Пружина 36 мм.</text><rect x="282" y="20" width="128" height="112" fill="none" stroke="#000" stroke-width="0.25"/><text x="284" y="28" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.0" font-weight="bold" text-anchor="start" fill="#000">3. БАЛКА 21, НАКЛАДКИ, ШПИЛЬКИ</text><text x="284" y="35" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">8 накладок 50×50: 2 винта M4×35 на конец балки,</text><text x="284" y="39.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">втулки 16×16×2 L=16; к стойкам не крепить — упор.</text><text x="284" y="43.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">Шпильки M10 L=117 в Ø10 нижних поперечин (Y=60/140);</text><text x="284" y="47.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">снизу шайба+гайка, под балкой шайба+гайка; вылет 5.</text><text x="284" y="51.8" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">Балка: верх 130, прорезь R15×5, ход вниз 20 мм.</text><rect x="10" y="142" width="128" height="112" fill="none" stroke="#000" stroke-width="0.25"/><text x="12" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.0" font-weight="bold" text-anchor="start" fill="#000">4. КАРТРИДЖ</text><text x="12" y="157" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">Шпилька → 6200 №1 (X=10) → конусы/гайки M10;</text><text x="12" y="161.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">6200 №2 (X=150) → конусы/гайки; кулачок на</text><text x="12" y="165.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">приваренную гайку X=74…82; шайбы Ø40, гайки,</text><text x="12" y="169.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">контргайки с двух сторон. Осевой люфт 0.</text><rect x="146" y="142" width="128" height="112" fill="none" stroke="#000" stroke-width="0.25"/><text x="148" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.0" font-weight="bold" text-anchor="start" fill="#000">5. КАРТРИДЖ В РАМУ</text><text x="148" y="157" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">Опустить балки 21 на 20 мм; отдать поджимные гайки;</text><text x="148" y="161.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">вставить картридж в седла R15×5; поднять балки, затянуть</text><text x="148" y="165.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">поджим; проверить контакт ролика.</text><text x="148" y="169.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">Смена: опустить балки на 20, блок на 44 мм, выдвинуть.</text><rect x="282" y="142" width="128" height="112" fill="none" stroke="#000" stroke-width="0.25"/><text x="284" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="4.0" font-weight="bold" text-anchor="start" fill="#000">6. ПОДСТОЛЬЕ И ДРЕЛЬ</text><text x="284" y="157" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">Подстолье на балки выноса; 4 потайных M6×60</text><text x="284" y="161.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">в приварные гайки; U-хомуты M6, шайбы, гайки.</text><text x="284" y="165.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">Дрель Ø100; ось совместить с валом; резиновая</text><text x="284" y="169.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.15" font-weight="normal" text-anchor="start" fill="#000">подкладка; проверить биение и крепление.</text><text x="12" y="276" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.4" font-weight="normal" text-anchor="start" fill="#000">МОМЕНТЫ: LMK M4×12 — 1,5; кожух M4×10 — 1,0; кронштейн M4×16 — 1,5; подстолье M6×60 — 5;</text><text x="12" y="281" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.4" font-weight="normal" text-anchor="start" fill="#000">накладки M4×35 — 2,5; шпильки M10 — 10; U-хомут M6 — 5; конус 6200 — 5; гайка/контргайка 6200 — 8; кулачок M10 — 8;</text><text x="12" y="286" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.4" font-weight="normal" text-anchor="start" fill="#000">ограничитель WCS10FR — 4 Н·м. Фиксатор резьбы — LMK, кожух, подстолье, кулачок. Проверки — checks.csv.</text></svg>