t-weight="normal" text-anchor="middle" fill="#000">50</text><line x1="325" y1="201" x2="319.4" y2="201" stroke="#000" stroke-width="0.12"/><line x1="325" y1="173.5" x2="319.4" y2="173.5" stroke="#000" stroke-width="0.12"/><line x1="321" y1="201" x2="321" y2="173.5" stroke="#000" stroke-width="0.16"/><polygon points="321,201 320.55,199.5 321.45,199.5" fill="#000"/><polygon points="321,173.5 321.45,175 320.55,175" fill="#000"/><rect x="319.8" y="186.05" width="2.4" height="2.4" fill="#fff" stroke="none"/><text x="320" y="187.25" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.0" font-weight="normal" text-anchor="middle" fill="#000" transform="rotate(-90 320 187.25)">50</text><text x="344.85" y="169.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" font-weight="normal" text-anchor="start" fill="#000">25</text><text x="330" y="208" font-family="DejaVu Sans, Arial, sans-serif" font-size="1.9" font-weight="normal" text-anchor="start" fill="#000">2×Ø4,5 под M4×35; лепесток 50 —</text><text x="330" y="211.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="1.9" font-weight="normal" text-anchor="start" fill="#000">упор в стойку 20 мм; крепления нет</text><text x="10" y="252" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" font-weight="normal" text-anchor="start" fill="#000">1. Накладки 14 — 8 шт., сталь 2 мм, 50×50, ширина 25; к балке</text><text x="10" y="255.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" font-weight="normal" text-anchor="start" fill="#000">   2 винта M4×35 с nyloc на конец; к стойкам не крепятся.</text><text x="10" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" font-weight="normal" text-anchor="start" fill="#000">2. Шпильки 41 — 4 шт., M10×117, строительные 4.6; Y=60/140;</text><text x="10" y="262.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" font-weight="normal" text-anchor="start" fill="#000">   низ 18 в гнезде Ø10 верхней стенки T13/T14; низ не сверлить.</text><text x="10" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" font-weight="normal" text-anchor="start" fill="#000">3. Опора: шайба 44 + гайка nyloc 42 на верхней грани T13/T14</text><text x="10" y="269.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" font-weight="normal" text-anchor="start" fill="#000">   (Z=20); шпилька опирается на гайку, а не на дно балки.</text><text x="10" y="273" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" font-weight="normal" text-anchor="start" fill="#000">4. Поджим: шайба 44 + гайка 43 снизу прижимной балки</text><text x="10" y="276.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" font-weight="normal" text-anchor="start" fill="#000">   (Z=100,5…110); сверху на шпильку ничего не накручено.</text><text x="10" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" font-weight="normal" text-anchor="start" fill="#000">5. Верх шпильки Z=135 — не более 5 мм над балкой (Z=130);</text><text x="10" y="283.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" font-weight="normal" text-anchor="start" fill="#000">   до нижних гаек валов (Z=140,5) — 5,5 мм; по Y разнесены.</text><text x="10" y="287" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" font-weight="normal" text-anchor="start" fill="#000">6. Съём: отдать гайку 43, опустить балку на 20 мм, поднять</text><text x="10" y="290.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.1" font-weight="normal" text-anchor="start" fill="#000">   её со шпильками на 2 мм и наклонить вперёд; снять гайку 42.</text><rect x="250" y="250" width="162" height="41" fill="none" stroke="#000" stroke-width="0.3"/><text x="253" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="6.0" font-weight="bold" text-anchor="start" fill="#000">УЗЕЛ ПОДЖИМА — fix11</text><text x="253" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.4" font-weight="normal" text-anchor="start" fill="#000">Лист 8/8. Формат A3. М 1:3…1:1,25</text><text x="253" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.0" font-weight="normal" text-anchor="start" fill="#000">Балка 21, шпильки M10, опора, поджим</text><text x="253" y="281" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.0" font-weight="normal" text-anchor="start" fill="#000">Проверки: cad/checks.csv; моменты: torque.csv</text><text x="253" y="288" font-family="DejaVu Sans, Arial, sans-serif" font-size="3.0" font-weight="normal" text-anchor="start" fill="#000">Размеры — params.csv, spec.csv</text></svg>