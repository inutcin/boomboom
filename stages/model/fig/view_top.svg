<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>Вибростол — эскиз, вид сверху и узел I, лист 2</title>
<desc>Вид сверху (масштаб 1:2), узел ролика (2:1) и эскизная спецификация.</desc>
<defs><style>
.v{stroke:#000;fill:none;stroke-width:0.7;stroke-linejoin:round;stroke-linecap:round}
.w{stroke:#000;fill:#fff;stroke-width:0.7;stroke-linejoin:round;stroke-linecap:round}
.h{stroke:#000;fill:none;stroke-width:0.34;stroke-dasharray:4 2}
.c{stroke:#000;fill:none;stroke-width:0.34;stroke-dasharray:12 2 2 2}
.d{stroke:#000;fill:none;stroke-width:0.34}
.n{font-family:'DejaVu Sans',Arial,sans-serif;font-size:7.2px;font-weight:bold;fill:#000}
.s{font-family:'DejaVu Sans',Arial,sans-serif;font-size:6.2px;fill:#000}
.k{font-family:'DejaVu Sans',Arial,sans-serif;font-size:2.5px;fill:#000}
.kt{font-family:'DejaVu Sans',Arial,sans-serif;font-size:3.2px;font-weight:bold;fill:#000}
</style></defs>
<rect width="420" height="297" fill="#fff"/>
<rect x="5" y="5" width="410" height="287" class="d"/>

<!-- ================= ВИД СВЕРХУ ================= -->
<g transform="translate(25,25) scale(0.5,0.5)">
  <!-- рама -->
  <path class="v" d="M0 0H240V240H0Z"/>
  <path class="v" d="M20 20H220V220H20Z"/>
  <!-- вынос: продольные трубы и торцевая -->
  <path class="v" d="M240 20H390V40H240Z M240 200H390V220H240Z M370 40H390V200H370Z"/>
  <!-- подстолье (18) -->
  <path class="w" d="M240 20H390V220H240Z"/>
  <!-- болты подстолья (7) -->
  <circle class="v" cx="250" cy="35" r="4"/>
  <circle class="v" cx="380" cy="35" r="4"/>
  <circle class="v" cx="250" cy="205" r="4"/>
  <circle class="v" cx="380" cy="205" r="4"/>
  <!-- скрытые дрель и хомут (8) -->
  <path class="h" d="M322 100H345V140H322Z M345 97H390V143H345Z"/>
  <path class="h" d="M315 97H345V103H315Z M315 137H345V143H315Z"/>
  <!-- скрытые балки (14) -->
  <path class="h" d="M30 20H50V220H30Z M190 20H210V220H190Z"/>
  <!-- скрытые опоры ротора -->
  <path class="h" d="M25 105H55V135H25Z M185 105H215V135H185Z"/>
  <!-- скрытые диск (16) и ролики (6) -->
  <path class="h" d="M85 80H155V160H85Z"/>
  <path class="h" d="M86 105H95V135H86Z M145 105H154V135H145Z"/>
  <!-- скрытые кронштейны (2) и ось -->
  <path class="h" d="M74 112H78V128H74Z M160 112H164V128H160Z"/>
  <path class="h" d="M78 95H108V145H78Z M130 95H160V145H130Z"/>
  <path class="h" d="M62 115H176V125H62Z"/>
  <!-- стол (1) и граница вогнутости -->
  <path class="w" d="M20 20H220V220H20Z"/>
  <path class="d" d="M40 40H200V200H40Z"/>
  <!-- отверстия направляющих, фланцы подшипников (11), пружины (10) -->
  <circle class="h" cx="40" cy="40" r="20"/>
  <circle class="h" cx="200" cy="40" r="20"/>
  <circle class="h" cx="40" cy="200" r="20"/>
  <circle class="h" cx="200" cy="200" r="20"/>
  <circle class="v" cx="40" cy="40" r="8"/>
  <circle class="v" cx="200" cy="40" r="8"/>
  <circle class="v" cx="40" cy="200" r="8"/>
  <circle class="v" cx="200" cy="200" r="8"/>
  <circle class="w" cx="40" cy="40" r="5"/>
  <circle class="w" cx="200" cy="40" r="5"/>
  <circle class="w" cx="40" cy="200" r="5"/>
  <circle class="w" cx="200" cy="200" r="5"/>
  <!-- гайки М6 (3) -->
  <circle class="w" cx="100" cy="105" r="4.5"/>
  <circle class="w" cx="100" cy="135" r="4.5"/>
  <circle class="w" cx="140" cy="105" r="4.5"/>
  <circle class="w" cx="140" cy="135" r="4.5"/>
  <!-- осевые -->
  <path class="c" d="M20 120H390 M120 60V180"/>
  <!-- размеры -->
  <path class="d" d="M0 0V-22 M240 0V-22 M390 0V-22 M0 0H-24 M0 240H-24 M20 20H-24 M20 220H-24"/>
  <path class="d" d="M0 -10H240 M-1.5 -11.5L1.5 -8.5 M238.5 -11.5L241.5 -8.5"/>
  <path class="d" d="M240 -10H390 M238.5 -11.5L241.5 -8.5 M388.5 -11.5L391.5 -8.5"/>
  <path class="d" d="M0 -20H390 M-1.5 -21.5L1.5 -18.5 M388.5 -21.5L391.5 -18.5"/>
  <path class="d" d="M-10 0V240 M-11.5 1.5L-8.5 -1.5 M-11.5 238.5L-8.5 241.5"/>
  <path class="d" d="M-20 20V220 M-21.5 21.5L-18.5 18.5 M-21.5 218.5L-18.5 221.5"/>
  <!-- выноски -->
  <path class="d" d="M170 38V58"/>
  <path class="d" d="M108 102L103 104"/>
  <path class="d" d="M262 47L253 38"/>
  <path class="d" d="M352 154L346 141"/>
  <path class="d" d="M212 188L204 202"/>
  <path class="d" d="M248 115L228 119"/>
</g>
<g transform="translate(25,25) scale(0.5,0.5)">
  <text class="s" x="120" y="-12" text-anchor="middle">240</text>
  <text class="s" x="315" y="-12" text-anchor="middle">150</text>
  <text class="s" x="195" y="-22" text-anchor="middle">390</text>
  <text class="s" x="-12" y="120" transform="rotate(-90 -12 120)" text-anchor="middle">240</text>
  <text class="s" x="-22" y="120" transform="rotate(-90 -22 120)" text-anchor="middle">200</text>
  <text class="n" x="170" y="30" text-anchor="middle">1</text>
  <text class="n" x="114" y="100" text-anchor="middle">3</text>
  <text class="n" x="266" y="49" text-anchor="middle">7</text>
  <text class="n" x="356" y="156" text-anchor="middle">8</text>
  <text class="n" x="216" y="186" text-anchor="middle">12</text>
  <text class="n" x="254" y="112" text-anchor="middle">17</text>
  <text class="n" x="300" y="70" text-anchor="middle">18</text>
  <text class="s" x="120" y="272" text-anchor="middle" font-size="5">Сверху</text>
</g>

<!-- ================= УЗЕЛ I (2:1) ================= -->
<g transform="translate(15,273) scale(2,-2) translate(-55,-126)">
  <path class="v" d="M55 165H180 M55 170H180"/>
  <!-- болт М6 (3) -->
  <path class="w" d="M95 158H105V161H95Z M98 161H102V170H98Z M97 170H103V173H97Z"/>
  <path class="c" d="M100 155V176"/>
  <!-- ось М10 -->
  <path class="w" d="M62 140H176V150H62Z"/>
  <!-- ролики (6) -->
  <path class="w" d="M86 130H95V160H86Z M145 130H154V160H145Z"/>
  <path class="c" d="M90.5 126V164 M149.5 126V164"/>
  <!-- конические гайки (5) -->
  <path class="w" d="M80 140H86V150H80Z M95 140H101V150H95Z M139 140H145V150H139Z M154 140H160V150H154Z"/>
  <!-- контргайки (4, 15) -->
  <path class="w" d="M62 140H70V150H62Z M168 140H176V150H168Z"/>
  <!-- кронштейны (2) -->
  <path class="w" d="M74 130H78V165H74Z M78 161H108V165H78Z"/>
  <path class="w" d="M160 130H164V165H160Z M130 161H160V165H130Z"/>
  <path class="c" d="M76 134V162 M162 134V162"/>
</g>
<g>
  <text class="kt" x="15" y="181">Узел I (2:1)</text>
  <!-- выноски -->
  <path class="d" d="M57 279V266"/>
  <path class="d" d="M30 279L37 246"/>
  <path class="d" d="M72 279L71 246"/>
  <path class="d" d="M94 279L88 266"/>
  <path class="d" d="M248 279V246"/>
  <path class="d" d="M110 179L104 192"/>
  <text class="n" x="57" y="284" text-anchor="middle">2</text>
  <text class="n" x="28" y="284" text-anchor="middle">4</text>
  <text class="n" x="72" y="284" text-anchor="middle">5</text>
  <text class="n" x="96" y="284" text-anchor="middle">6</text>
  <text class="n" x="248" y="284" text-anchor="middle">15</text>
  <text class="n" x="112" y="176" text-anchor="middle">3</text>
</g>

<!-- ================= СПЕЦИФИКАЦИЯ ================= -->
<text x="270" y="32" class="kt">Спецификация (эскизная)</text>
<path class="d" d="M270 35H410 M280 35V149 M390 35V149"/>
<path class="d" d="M270 41H410 M270 47H410 M270 53H410 M270 59H410 M270 65H410 M270 71H410 M270 77H410 M270 83H410 M270 89H410 M270 95H410 M270 101H410 M270 107H410 M270 113H410 M270 119H410 M270 125H410 M270 131H410 M270 137H410 M270 143H410 M270 149H410"/>
<text x="272" y="39.5" class="k">Поз.</text>
<text x="283" y="39.5" class="k">Наименование</text>
<text x="407" y="39.5" class="k" text-anchor="end">Кол.</text>
<text x="272" y="45.5" class="k">1</text><text x="283" y="45.5" class="k">Стол 200×200, верх вогнутый, 10 мм</text><text x="407" y="45.5" class="k" text-anchor="end">1</text>
<text x="272" y="51.5" class="k">2</text><text x="283" y="51.5" class="k">Кронштейн ролика (уголок с пазами)</text><text x="407" y="51.5" class="k" text-anchor="end">2</text>
<text x="272" y="57.5" class="k">3</text><text x="283" y="57.5" class="k">Болт потайной М6 с гайкой</text><text x="407" y="57.5" class="k" text-anchor="end">4</text>
<text x="272" y="63.5" class="k">4</text><text x="283" y="63.5" class="k">Гайка самоконтрящаяся М10</text><text x="407" y="63.5" class="k" text-anchor="end">2</text>
<text x="272" y="69.5" class="k">5</text><text x="283" y="69.5" class="k">Гайка коническая М10</text><text x="407" y="69.5" class="k" text-anchor="end">4</text>
<text x="272" y="75.5" class="k">6</text><text x="283" y="75.5" class="k">Подшипник 6200 (10×30×9) — ролик</text><text x="407" y="75.5" class="k" text-anchor="end">2</text>
<text x="272" y="81.5" class="k">7</text><text x="283" y="81.5" class="k">Болт и гайка подстолья М6×40</text><text x="407" y="81.5" class="k" text-anchor="end">4</text>
<text x="272" y="87.5" class="k">8</text><text x="283" y="87.5" class="k">Хомут U-образный для дрели, резьба М6</text><text x="407" y="87.5" class="k" text-anchor="end">2</text>
<text x="272" y="93.5" class="k">9</text><text x="283" y="93.5" class="k">Болт крепления направляющей М6</text><text x="407" y="93.5" class="k" text-anchor="end">4</text>
<text x="272" y="99.5" class="k">10</text><text x="283" y="99.5" class="k">Пружина прижимная Ø16</text><text x="407" y="99.5" class="k" text-anchor="end">4</text>
<text x="272" y="105.5" class="k">11</text><text x="283" y="105.5" class="k">Подшипник линейный с фланцем d10 (LMF10UU)</text><text x="407" y="105.5" class="k" text-anchor="end">4</text>
<text x="272" y="111.5" class="k">12</text><text x="283" y="111.5" class="k">Направляющая Ø10</text><text x="407" y="111.5" class="k" text-anchor="end">4</text>
<text x="272" y="117.5" class="k">13</text><text x="283" y="117.5" class="k">Соединитель профильной трубы 20×20</text><text x="407" y="117.5" class="k" text-anchor="end">12</text>
<text x="272" y="123.5" class="k">14</text><text x="283" y="123.5" class="k">Балка фиксации подшипников (с прорезью)</text><text x="407" y="123.5" class="k" text-anchor="end">4</text>
<text x="272" y="129.5" class="k">15</text><text x="283" y="129.5" class="k">Контргайка М10</text><text x="407" y="129.5" class="k" text-anchor="end">2</text>
<text x="272" y="135.5" class="k">16</text><text x="283" y="135.5" class="k">Диск кулачковый эксцентриковый Ø80×70</text><text x="407" y="135.5" class="k" text-anchor="end">1</text>
<text x="272" y="141.5" class="k">17</text><text x="283" y="141.5" class="k">Шпилька-ротор М10 с хвостовиком</text><text x="407" y="141.5" class="k" text-anchor="end">1</text>
<text x="272" y="147.5" class="k">18</text><text x="283" y="147.5" class="k">Подстолье, фанера 15, 200×150</text><text x="407" y="147.5" class="k" text-anchor="end">1</text>

<!-- ================= ПОЯСНЕНИЯ ================= -->
<text x="270" y="162" class="kt">Пояснения к узлу I</text>
<text x="270" y="169" class="k">Кронштейн 2 притянут контргайкой 15 к конической гайке 5.</text>
<text x="270" y="174" class="k">Ролик 6 зажат между коническими гайками 5 на оси М10.</text>
<text x="270" y="179" class="k">Вертикальный паз кронштейна — выведение роликов на одну</text>
<text x="270" y="184" class="k">высоту, горизонтальный паз — установка по столу.</text>
<text x="270" y="192" class="kt">Пояснения к виду сверху</text>
<text x="270" y="199" class="k">Стол 200×200, вогнутость вписана в квадрат 160×160.</text>
<text x="270" y="204" class="k">Вынос подстолья 150; подстолье 200×150, фанера 15.</text>
<text x="270" y="209" class="k">Гайки 3 — на верхней плоскости стола, болты потайные.</text>

<rect x="270" y="260" width="140" height="27" class="d"/>
<path class="d" d="M270 269H410 M270 278H410 M340 260V287"/>
<text x="274" y="266" class="kt">Вибростол лабораторный — эскиз</text>
<text x="274" y="275" class="k">Вид сверху, узел I</text>
<text x="344" y="275" class="k">1:2, узел 2:1</text>
<text x="274" y="285" class="k">Этап: формирование эскизов</text>
<text x="344" y="285" class="k">Лист 2 из 3</text>
</svg>
