<!-- ================= ПРИМЕЧАНИЯ ================= -->
<text x="12" y="211" class="kt">Примечания</text>
<text x="12" y="218" class="k">1. Рама и вынос — труба профильная 20×20×1,5; угловые и Т-образные соединения — поз. 13.</text>
<text x="12" y="223" class="k">2. Ход стола 2e = 3…10 мм задаётся эксцентриситетом диска e = 1,5…5 мм (диск сменный).</text>
<text x="12" y="228" class="k">3. Четыре пружины (поз. 10) прижимают стол к диску; поджатие должно быть не менее 5 веса стола</text>
<text x="12" y="233" class="k">    (ускорение стола на 15 Гц при ходе 10 мм — около 4,5 g).</text>
<text x="12" y="238" class="k">4. Поз. 2, 4, 5, 6, 15 показаны схематично; устройство узла — см. Узел I, лист 2.</text>
<text x="12" y="243" class="k">5. Дрель показана тонкой линией и в изделие не входит.</text>
<text x="12" y="248" class="k">6. Размеры без указаний на эскизе приняты на этапе эскизов и уточняются при разработке.</text>

